<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUGEL: simulador de IA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="modo-hacker">
    <div id="app-container">
        <aside id="sidebar">
            <div class="brand">GUGEL: simulador de IA</div>
            
            <div class="menu-section">
                <div class="section-title">🕹️ MODOS DE JUEGO</div>
                <button id="btn-mode-campaña" class="mode-btn active" onclick="cambiarModoEstrategia('campaña')">
                    📌 LAS 10 CAMPAÑAS
                </button>
                <button id="btn-mode-infinito" class="mode-btn" onclick="cambiarModoEstrategia('infinito')">
                    ♾️ PREGUNTAS INFINITAS
                </button>
            </div>

            <div class="menu-section">
                <div class="section-title">🖥️ PANELES</div>
                <button id="btn-view-perfil" class="sub-btn" onclick="switchView('view-perfil')">DATOS PERFIL</button>
                <button id="btn-view-logros" class="sub-btn" onclick="switchView('view-logros')">LOGROS SISTEMA</button>
                <button id="btn-view-historial" class="sub-btn" onclick="switchView('view-historial')">📁 HISTORIAL</button>
            </div>

            <div class="menu-section">
                <div class="section-title">👤 CUENTA</div>
                <button id="btn-gestion-cuenta" class="sub-btn">GESTIÓN CUENTA</button>
            </div>
        </aside>

        <main id="main-content">
            <div id="chat-messages"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
