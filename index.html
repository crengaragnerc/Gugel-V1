<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUGEL - Interfaz Core</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside id="sidebar">
            <div class="brand">GUGEL CORE</div>
            <button id="btn-gestion-cuenta" class="main-btn">👤 REGISTRAR CUENTA</button>
            <nav class="menu-nav">
                <button id="btn-view-core" class="sub-btn active" onclick="switchView('view-core')">🖥️ Núcleo Central</button>
                <button id="btn-view-logros" class="sub-btn" onclick="switchView('view-logros')">🏆 Logros (<span id="logros-count">0</span>)</button>
                <button id="btn-view-historial" class="sub-btn" onclick="switchView('view-historial')">📜 Registros Antiguos</button>
            </nav>
        </aside>

        <main class="main-content">
            <div id="view-core" class="content-panel active">
                <div class="panel-header">
                    <span id="panel-title-text">Interfaz Core - CAMPAÑA</span>
                    <span id="global-level-badge">Nivel de IA: <span id="prof-level">1</span></span>
                </div>

                <div class="server-status-bar">
                    <div>Satisfacción: <span id="prof-satisfaction">50%</span></div>
                    <div>Humor: <span id="prof-opinion">(estable)</span></div>
                </div>

                <div id="chat-messages" class="chat-container"></div>

                <div class="control-bar">
                    <form id="chat-form" autocomplete="off">
                        <input type="text" id="user-input" placeholder="Esperando al sistema..." disabled>
                        <button type="submit" id="transmit-btn">TRANSMITIR</button>
                        <button type="button" id="continue-btn" style="display:none;">CONTINUAR</button>
                    </form>
                </div>
            </div>

            <div id="view-logros" class="content-panel">
                <h2>Logros de Transmisión Desbloqueados</h2>
                <div id="logros-container" class="list-grid"></div>
            </div>

            <div id="view-historial" class="content-panel">
                <h2>Logs de Conexión Recientes</h2>
                <div id="history-list-container" class="list-grid"></div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
