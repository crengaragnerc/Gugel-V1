<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GUGEL Core</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-wrapper">
        <div class="chat-card">
            <div class="chat-header">
                <h2>GUGEL Core</h2>
                <div class="status-indicator">● Online</div>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <form id="chat-form">
                <input type="text" id="user-input" placeholder="Escribe tu respuesta..." autocomplete="off">
                <button type="submit">TRANSMITIR</button>
            </form>
        </div>
    </div>
    
    <div class="modal-overlay" id="result-modal" style="display: none;">
        <div class="modal-box">
            <h3 id="modal-title">Evaluación</h3>
            <h1 id="modal-score-number">0/10</h1>
            <button class="btn-primary" onclick="closeResultModal()">CONTINUAR</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
