<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GUGEL Console</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="chat-container">
        <header class="header">
            <h1>GUGEL Console</h1>
            <div class="status-badge" id="status-dot">● Conectado</div>
        </header>

        <div class="chat-messages" id="chat-messages"></div>

        <form class="input-area" id="chat-form">
            <input type="text" id="user-input" placeholder="Escribe tu respuesta técnica avanzada..." autocomplete="off">
            <button type="submit" id="send-btn">Enviar</button>
        </form>
    </div>

    <!-- Modal elegante -->
    <div class="modal-overlay" id="result-modal" style="display: none;">
        <div class="modal-box">
            <h3>Evaluación del Sistema</h3>
            <div class="score-display">
                <h1 id="modal-score-number">0/10</h1>
            </div>
            <button class="btn-primary" onclick="closeResultModal()">Continuar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
