<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUGEL Core</title>
    <style>
        * { box-sizing: border-box; font-family: monospace; }
        body { margin: 0; background: #121212; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        .chat-card { 
            width: 650px; 
            height: 85vh; 
            background: #1e1e1e; 
            border-radius: 16px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            border: 1px solid #333; 
        }
        
        .header { background: #1a1a1a; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .header h2 { margin: 0; font-size: 1.1rem; color: #00ff00; }
        .mode-selector { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 5px 10px; border-radius: 6px; outline: none; cursor: pointer; }
        
        .status-panel { 
            background: #161616; 
            padding: 12px 20px; 
            border-bottom: 1px solid #333; 
            display: flex; 
            justify-content: flex-end; 
            font-size: 12px; 
            color: #aaa; 
        }
        
        .chat-messages { flex: 1; padding: 25px; overflow-y: auto; background: #141414; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 18px; border-radius: 12px; max-width: 75%; font-size: 14px; line-height: 1.5; }
        .message.gugel { background: #222; align-self: flex-start; color: #00ff00; border: 1px solid #333; }
        .message.ai { background: #00ff00; color: #000; align-self: flex-end; font-weight: bold; }
        
        #chat-form { padding: 20px; border-top: 1px solid #333; display: flex; gap: 10px; background: #1a1a1a; }
        input { flex: 1; padding: 14px; background: #222; border: 1px solid #444; color: #fff; border-radius: 8px; outline: none; font-size: 14px; }
        input:focus { border-color: #00ff00; }
        
        button { padding: 14px 24px; background: #00ff00; color: #000; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }
        
        #continue-btn { background: #fff; color: #000; display: none; width: 100%; }

        /* Modos visuales */
        body.modo-oscuro { background: #121212; }
        body.modo-oscuro .chat-card { background: #1e1e1e; border-color: #333; }
        body.modo-oscuro .header h2 { color: #fff; }
        body.modo-oscuro .message.gugel { color: #fff; background: #2a2a2a; border-color: #444; }
        body.modo-oscuro .message.ai { background: #fff; color: #000; }
        body.modo-oscuro button#transmit-btn { background: #fff; color: #000; }
        
        body.modo-claro { background: #f0f2f5; }
        body.modo-claro .chat-card { background: #ffffff; border-color: #ddd; }
        body.modo-claro .header { background: #f8f9fa; border-color: #ddd; }
        body.modo-claro .header h2 { color: #333; }
        body.modo-claro .chat-messages { background: #fafafa; }
        body.modo-claro .message.gugel { color: #222; background: #f0f0f0; border-color: #e0e0e0; }
        body.modo-claro .message.ai { background: #333; color: #fff; }
        body.modo-claro #chat-form { background: #ffffff; border-color: #ddd; }
        body.modo-claro input { background: #fff; border-color: #ccc; color: #222; }
        body.modo-claro button#transmit-btn { background: #333; color: #fff; }
        body.modo-claro .status-panel { background: #f1f1f1; border-color: #ddd; color: #555; }
    </style>
</head>

            <select class="mode-selector" id="mode-select" onchange="changeSystemMode()">

                <option value="modo-oscuro">Modo Oscuro</option>
                <option value="modo-claro">Modo Claro</option>
            </select>
        </header>

        <div class="status-panel">

        <div class="chat-messages" id="chat-messages"></div>

        <form id="chat-form">

            <button type="submit" id="transmit-btn">TRANSMITIR</button>
            <button type="button" id="continue-btn" onclick="confirmContinue()">CONTINUAR</button>
        </form>
    </div>
