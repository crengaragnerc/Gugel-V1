<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUGEL: simulador de IA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="modo-hacker">
    <div id="app-container">
        <aside id="sidebar">
            <div class="brand">GUGEL: simulador de IA</div>
            
            <div class="menu-section">
                <div class="section-title">🕹️ MODOS DE JUEGO</div>
                <button id="btn-mode-campaña" class="mode-btn active" onclick="cambiarModoEstrategia('campaña')">
                    📌 LAS 10 CAMPAÑAS
                </button>
                <button id="btn-mode-infinito" class="mode-btn" onclick="cambiarModoEstrategia('infinito')">
                    ♾️ PREGUNTAS INFINITAS
                </button>
            </div>

            <div class="menu-section">
                <div class="section-title">🖥️ PANELES</div>
                <button id="btn-view-perfil" class="sub-btn" onclick="switchView('view-perfil')">DATOS PERFIL</button>
                <button id="btn-view-logros" class="sub-btn" onclick="switchView('view-logros')">LOGROS SISTEMA</button>
                <button id="btn-view-historial" class="sub-btn" onclick="switchView('view-historial')">HISTORIAL</button>
            </div>

            <div class="menu-section">
                <div class="section-title">👤 USUARIO</div>
                <button id="btn-gestion-cuenta">👤 CREAR CUENTA</button>
            </div>
        </aside>

        <main id="main-content">
            <header id="panel-header">
                <span id="panel-title-text">Interfaz Core</span>
                <select id="mode-select" onchange="cambiarTema(this.value)">
                    <option value="modo-hacker">Modo Hacker</option>
                    <option value="modo-claro">Modo Claro</option>
                    <option value="modo-oscuro">Modo Oscuro</option>
                </select>
            </header>

            <section id="view-core" class="content-panel active">
                <div id="chat-container">
                    <div id="chat-messages"></div>
                    <form id="chat-form">
                        <input type="text" id="user-input" placeholder="introduce tu respuesta de ia..." autocomplete="off">
                        <button type="submit" id="transmit-btn">TRANSMITIR</button>
                        <button type="button" id="continue-btn" onclick="confirmContinue()">CONTINUAR</button>
                    </form>
                </div>
            </section>

            <section id="view-perfil" class="content-panel">
                <div class="card">
                    <h3>📊 Datos de Usuario</h3>
                    <div class="opinion-box" id="opinion-container">
                        <strong>OPINIÓN DE GUGEL:</strong> <span id="prof-opinion">(analizando conexiones...)'</span>
                    </div>
                    <p><strong>Satisfacción del usuario:</strong> <span id="prof-satisfaction">50%</span></p>
                    <p><strong>Consultas totales procesadas:</strong> <span id="prof-cycles">0</span></p>
                    <p><strong>Caracteres totales enviados:</strong> <span id="prof-chars">0</span></p>
                </div>
            </section>

            <section id="view-logros" class="content-panel">
                <div class="card">
                    <h3>🏆 Logros de Sistema (<span id="logros-count">0</span>)</h3>
                    <div id="logros-container" class="list-container"></div>
                </div>
            </section>

            <section id="view-historial" class="content-panel">
                <div class="card">
                    <h3>📁 Historial de Conversaciones</h3>
                    <button class="action-btn" onclick="exportCoreData()">Copiar Logs al Portapapeles</button>
                    <div id="history-list-container" class="list-container"></div>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
