<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GUGEL: Simulador de IA</title>
    <link class="tema-link" rel="stylesheet" href="style.css">
</head>
<body class="modo-hacker">

    <div id="app-container">
        <aside id="sidebar">
            <div class="menu-section">
                <div class="section-title">🕹️ MODOS</div>
                <button id="btn-modo-campaña" class="sub-btn" onclick="seleccionarModoJuego('campaña')">📌 Campaña</button>
                <button id="btn-modo-infinito" class="sub-btn" onclick="seleccionarModoJuego('infinito')">♾️ Infinito</button>
            </div>

            <div class="menu-section">
                <div class="section-title">👤 SESIÓN</div>
                <button id="btn-view-perfil" class="sub-btn" onclick="switchView('view-perfil')">ESTADO</button>
                <button id="btn-view-logros" class="sub-btn" onclick="switchView('view-logros')">LOGROS</button>
                <button id="btn-view-historial" class="sub-btn" onclick="switchView('view-historial')">BÚFER</button>
            </div>

            <div class="menu-section-footer">
                <div class="account-badge-sidebar">Usuario: <span id="sidebar-user-display">Invitado</span></div>
                <button id="btn-open-cuenta" class="sub-btn account-btn" onclick="abrirModalCuenta()">CUENTA</button>
            </div>
        </aside>

        <main id="main-content">
            <header id="top-bar">
                <div class="brand-top">GUGEL Core</div>
                <select id="theme-select" onchange="cambiarTemaPantalla(this.value)">
                    <option value="modo-hacker">🟩 Hacker</option>
                    <option value="modo-oscuro">🟦 Oscuro</option>
                    <option value="modo-claro">⬜ Claro</option>
                    <option value="modo-rosa">🌸 Rosa</option>
                    <option value="modo-espacial">🌌 Espacial</option>
                </select>
            </header>

            <div id="views-wrapper">
                <section id="view-juego" class="content-panel active-view">
                    <div id="game-workspace">
                        <div class="card terminal-card">
                            <div class="terminal-header">
                                <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
                                <span id="modo-badge">MODO: CAMPAÑA</span>
                            </div>
                            <div id="peticion-entrada-box">
                                <span class="prompt-symbol">&gt;&gt;</span>
                                <p id="texto-pregunta">Cargando...</p>
                            </div>
                        </div>

                        <div class="card opinion-card">
                            <p id="texto-opinion" class="opinion-box">(Evaluando...)</p>
                        </div>

                        <div class="card chat-card">
                            <div id="chat-logs-render"></div>
                            <form id="chat-form" onsubmit="return false;">
                                <div class="input-container">
                                    <textarea id="user-response-input" placeholder="Respuesta..." required></textarea>
                                    <button type="submit" id="send-btn">ENVIAR</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </section>

                <section id="view-perfil" class="content-panel">
                    <div class="card">
                        <h3>📊 Estado Analítico</h3>
                        <div class="stat-box">
                            <span class="stat-label">Satisfacción</span>
                            <div class="progress-bar-container"><div id="satisfaction-bar" class="progress-fill"></div></div>
                            <span id="satisfaction-value" class="stat-number">50%</span>
                        </div>
                        <button class="sub-btn" onclick="reiniciarProgresoCompleto()" style="margin-top:20px;">BORRAR PROGRESO</button>
                    </div>
                </section>

                <section id="view-logros" class="content-panel">
                    <div class="card">
                        <h3>🏆 Logros (<span id="logros-count">0</span>/40)</h3>
                        <div id="logros-container" class="list-container"></div>
                    </div>
                </section>

                <section id="view-historial" class="content-panel">
                    <div class="card">
                        <h3>📁 Búfer</h3>
                        <div id="history-list-container" class="list-container"></div>
                    </div>
                </section>
            </div>

            <footer id="bottom-bar">
                <button id="continue-btn" onclick="clickBotonContinuar()" style="display:none;">SIGUIENTE</button>
            </footer>
        </main>
    </div>

    <div id="modal-cuenta-sistema" class="modal-overlay" style="display: none;">
        <div class="modal-content card">
            <h3>Gestión de Cuenta</h3>
            <input type="text" id="account-username" placeholder="Alias">
            <input type="password" id="account-password" placeholder="Contraseña">
            <button class="sub-btn" onclick="guardarNombreCuenta()">ACCEDER</button>
        </div>
    </div>
    <div id="notificaciones-sistema" class="toast-wrapper"></div>
    <script src="script.js"></script>
</body>
</html>
