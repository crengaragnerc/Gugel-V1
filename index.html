<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GUGEL Core</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="modo-hacker">
    <div class="system-container">
        <div class="sidebar">
            <button class="nav-btn active" id="btn-view-consultas" onclick="switchView('view-consultas')">💬 CONSULTAS</button>
            <button class="nav-btn" id="btn-view-perfil" onclick="switchView('view-perfil')">ESTADO ANALÍTICO</button>
        </div>
        <div class="chat-card">
            <header class="header">
                <h2>GUGEL Core</h2>
                <select class="mode-selector" id="mode-select" onchange="changeSystemMode()">
                    <option value="modo-hacker">Modo Hacker</option>
                    <option value="modo-observatorio">Modo Observatorio</option>
                </select>
            </header>
            <div id="view-consultas" class="content-panel active">
                <div class="chat-messages" id="chat-messages"></div>
                <form id="chat-form">
                    <input type="text" id="user-input" placeholder="respuesta..." autocomplete="off">
                    <button type="submit" class="action-btn">TRANSMITIR</button>
                </form>
            </div>
            <div id="view-perfil" class="content-panel">
                <h3>Estado Analítico</h3>
                <div class="data-item">
                    <div class="data-label">Opinión de Gugel:</div>
                    <div id="prof-opinion">No hay consultas.</div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
