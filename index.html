<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUGEL Core</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chat-card">
        <header class="header">
            <h2>GUGEL Core</h2>
        </header>
        <div class="chat-messages" id="chat-messages"></div>
        <form id="chat-form">
            <input type="text" id="user-input" placeholder="Escribe tu respuesta..." autocomplete="off">
            <button type="submit" id="send-btn">ENVIAR</button>
        </form>
    </div>

    <div class="modal-overlay" id="result-modal" style="display: none;">
        <div class="modal-box">
            <h1 id="modal-score-number">0/10</h1>
            <button onclick="closeResultModal()">CONTINUAR</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
