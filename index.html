<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUGEL: Simulador de IA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-verde-neon">

    <!-- BARRA LATERAL -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>GUGEL v4.0</h2>
            <span class="badge">Invitado</span>
        </div>

        <nav class="menu">
            <p class="menu-label">Modos de Simulación</p>
            <button id="btn-campana" class="menu-item active" onclick="cambiarModo('campana')">
                <span class="icon">📢</span> Panel de Campaña
            </button>
            <button id="btn-infinitas" class="menu-item" onclick="cambiarModo('infinitas')">
                <span class="icon">♾️</span> Consultas Infinitas
            </button>

            <p class="menu-label">Datos y Registros</p>
            <button class="menu-item">
                <span class="icon">📊</span> Estado Analítico
            </button>
            <button class="menu-item">
                <span class="icon">📁</span> Búfer de Logs
            </button>
            <button class="menu-item">
                <span class="icon">🔑</span> Perfil de Operador
            </button>
        </nav>

        <div class="sidebar-footer">
            <label for="theme-select">Interfaz:</label>
            <select id="theme-select" onchange="cambiarTema(this.value)">
                <option value="theme-verde-neon">Verde Neón</option>
                <option value="theme-espacial">Espacial</option>
            </select>
        </div>
    </aside>

<div class="menu-section">
    <div class="section-title">🎨 TEMA VISUAL</div>
    <select id="theme-select" onchange="cambiarTema(this.value)" style="width:100%; padding: 5px;">
        <option value="modo-hacker">Hacker</option>
        <option value="modo-oscuro">Oscuro</option>
        <option value="modo-claro">Claro</option>
        <option value="modo-rosa">Rosa</option>
        <option value="modo-espacial">Espacial</option>
    </select>
</div>
    
    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
        <div class="banner-alerta">
            ⚠️ Sesión de Invitado: los logs se autodestruirán al cerrar el navegador. Regístrate en el Perfil de Operador.
        </div>

        <!-- ÁREA DEL CHAT -->
        <section class="chat-container">
            <div id="chat-box" class="chat-box">
                <!-- Los mensajes del usuario simulado (Gugel) e IA aparecerán aquí -->
            </div>

            <!-- ENTRADA DE RESPUESTA -->
            <div class="input-container">
                <input type="text" id="input-respuesta" placeholder="Introduce tu respuesta..." onkeydown="evaluarEnter(event)">
                <button id="btn-transmitir" onclick="transmitirRespuesta()">TRANSMITIR</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
