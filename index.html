<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUGEL: simulador de IA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pink-theme">
    <div class="container">
        <!-- Sidebar Izquierda -->
        <aside class="sidebar">
            <div class="menu-group">
                <h3>👤 MODOS DE CONSULTA</h3>
                <button class="menu-btn">📌 Panel de Campaña</button>
                <button class="menu-btn active">∞ Consultas Infinitas</button>
            </div>
            
            <div class="menu-group">
                <h3>👤 MONITOR DE SESIÓN</h3>
                <button class="menu-btn">ESTADO ANALÍTICO</button>
            </div>
            
            <div class="menu-group">
                <h3>🏆 REGISTRO INTERNO</h3>
                <button class="menu-btn" id="btn-logros-sistema">LOGROS DEL SISTEMA</button>
            </div>
            
            <div class="menu-group">
                <h3>📁 REGISTRO CENTRAL</h3>
                <button class="menu-btn">BÚFER DE LOGS</button>
            </div>
            
            <div class="sidebar-footer">
                <p class="operator-text">Operador: Invitado</p>
                <button id="btn-gestion-cuenta" class="account-btn">GESTIÓN DE CUENTA</button>
            </div>
        </aside>

        <!-- Panel Central / Principal -->
        <main class="main-content">
            <h2 class="core-title">GUGEL Core</h2>
            <div class="content-box">
                <h3 class="box-title">📁 Búfer de Logs y Favoritos</h3>
                
                <div class="action-buttons">
                    <button class="action-btn">Copiar Logs al Portapapeles</button>
                    <button class="action-btn">EXPORTAR SESIÓN COMPLETA</button>
                </div>
                
                <div class="section-block">
                    <h4>⭐ MARCADORES FAVORITOS</h4>
                    <p class="empty-text">No hay marcadores guardados.</p>
                </div>
                
                <hr class="divider">
                
                <div class="section-block">
                    <h4>📜 HISTORIAL DE CONSULTAS GENERAL (Haz clic para cargar en el chat)</h4>
                    <p class="empty-text">Búfer de logs vacío.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Contenedor flotante de logros (Esquina superior derecha) -->
    <div id="achievements-container"></div>

    <script src="script.js"></script>
</body>
</html>
