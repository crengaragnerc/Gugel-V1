<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GUGEL: Simulador de IA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="stats">Satisfacción: 50%</div>
    
    <div id="pantalla-campana" class="panel">
        <h1>Buscador GUGEL</h1>
        <div id="mensajes"></div>
        <input type="text" id="userInput" placeholder="Escribe tu consulta...">
        <button id="btnEnviar">Buscar</button>
    </div>

    <div id="pantalla-infinito" class="panel" style="display:none;">
        <h1>Generador Infinito</h1>
        <div id="output-infinito"></div>
        <button id="btnGenerar">Nueva Pregunta</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
