<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>GUGEL Console</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="screen">
        
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>GUGEL Console</h2>
                <div class="theme-selector">
                    <button onclick="setTheme('light')">☀️</button>
                    <button onclick="setTheme('dark')">🌙</button>
                    <button onclick="setTheme('hacker')">📟</button>
                </div>
            </div>

            <div class="stats-section">
                <h3>Rango de Sistema</h3>
                <div class="level-badge" id="player-level">Nivel 1 (Iniciante)</div>
                <p>Puntuación Total: <strong id="total-score">0</strong></p>
            </div>

            <div class="stats-section">
                <h3>Estado del Usuario</h3>
                <p>Satisfacción: <strong id="satisfaction-percentage">50%</strong></p>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="satisfaction-bar" style="width: 50%;"></div>
                </div>
                <p style="margin-top: 5px; font-size: 12px; color: var(--text-muted);">
                    Opinión de GUGEL: <strong id="gugel-opinion">Indiferente</strong>
                </p>
            </div>

            <nav class="sidebar-nav">
                <button class="nav-btn active" onclick="switchTab('chat-tab')">💬 Terminal de Chat</button>
                <button class="nav-btn" onclick="switchTab('archive-tab')">📁 Archivo de Chats</button>
                <button class="nav-btn" onclick="switchTab('achievements-tab')">🏆 Logros Obtenidos</button>
            </nav>
        </aside>

        <main class="main-content">
            
            <div id="chat-tab" class="tab-content">
                <div class="chat-header">
                    <div class="status-indicator connected"></div>
                    <span id="gugel-status">Conectado</span>
                </div>
                
                <div class="chat-messages" id="chat-messages"></div>

                <div class="suggestion-box" id="suggestion-box" style="display: none;"></div>

                <form class="chat-input-area" id="chat-form">
                    <input type="text" id="user-input" placeholder="Escribe tu respuesta técnica avanzada..." autocomplete="off">
                    <button type="submit" id="send-btn">Enviar</button>
                </form>
            </div>

            <div id="archive-tab" class="tab-content" style="display: none;">
                <div class="tab-header-title">
                    <h2>📁 Archivo de Logs Guardados</h2>
                </div>
                <div class="archive-list" id="archive-list"></div>
            </div>

            <div id="achievements-tab" class="tab-content" style="display: none;">
                <div class="tab-header-title">
                    <h2>🏆 Logros Obtenidos</h2>
                </div>
                <div class="achievements-list" id="achievements-list"></div>
            </div>

        </main>
    </div>

    <div class="modal-overlay" id="result-modal" style="display: none;">
        <div class="modal-box">
            <h3>Evaluación del Sistema</h3>
            <div class="result-details">
                <p><strong>Petición:</strong> <span id="modal-question">""</span></p>
                <p><strong>Tu Respuesta:</strong> <span id="modal-answer">""</span></p>
            </div>
            <div class="score-display">
                <span>Puntuación:</span>
                <h1 id="modal-score-number">0/10</h1>
            </div>
            <button class="btn-primary" onclick="closeResultModal()">Aceptar y Continuar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
