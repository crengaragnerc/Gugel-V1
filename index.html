<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUGEL Core System</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --panel-bg: #161820;
            --border-color: #2a2d3d;
            --text-color: #e2e8f0;
            --accent-color: #3b82f6;
            --gugel-msg: #1f2937;
            --ai-msg: #2563eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 2px solid var(--border-color);
            padding: 12px 20px;
        }

        h1 {
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: #f39c12;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .chat-panel {
            flex: 2;
            display: flex;
            flex-direction: column;
            border-right: 2px solid var(--border-color);
            background: rgba(0,0,0,0.05);
        }

        #chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.4;
            font-size: 0.95rem;
        }

        .message.gugel {
            background-color: var(--gugel-msg);
            align-self: flex-start;
            border-left: 4px solid #f1c40f;
        }

        .message.ai {
            background-color: var(--ai-msg);
            align-self: flex-end;
            border-right: 4px solid #00ff00;
        }

        .input-area {
            background-color: var(--panel-bg);
            border-top: 2px solid var(--border-color);
            padding: 15px;
        }

        #chat-form {
            display: flex;
            gap: 10px;
        }

        #user-input {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1rem;
        }

        #user-input:focus {
            outline: none;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }

        #continue-btn {
            background-color: #27ae60;
            width: 100%;
            padding: 12px;
        }

        .status-panel {
            flex: 1;
            max-width: 380px;
            background-color: var(--panel-bg);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .panel-section {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .panel-header {
            font-size: 0.95rem;
            font-weight: bold;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-bottom: 15px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 5px;
        }

        .data-item {
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        .data-item strong {
            color: #a0aec0;
        }

        #history-list-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
        }

        .historial-item {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            line-height: 1.4;
        }

        .btn-utility {
            background-color: #34495e;
            padding: 8px 12px;
            font-size: 0.8rem;
            margin-top: 10px;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="panel-title-text">GUGEL Core System</h1>
    </header>

    <div class="main-container">
        <div class="chat-panel">
            <div id="chat-messages"></div>
            <div class="input-area">
                <form id="chat-form">
                    <input type="text" id="user-input" autocomplete="off" placeholder="GUGEL buscando...">
                    <button type="submit" id="transmit-btn">RESPONDER</button>
                    <button type="button" id="continue-btn" style="display: none;" onclick="confirmContinue()">SIGUIENTE CONSULTA</button>
                </form>
            </div>
        </div>

        <div class="status-panel">
            <div class="panel-section">
                <div class="panel-header">Estado de GUGEL</div>
                <div class="panel-body">
                    <div class="data-item">
                        <strong>Mentalidad:</strong> <span id="prof-opinion">(Pensando...)</span>
                    </div>
                    <div class="data-item">
                        <strong>Satisfacción:</strong> <span id="prof-satisfaction">50%</span>
                    </div>
                    <div class="data-item">
                        <strong>Fase Actual:</strong> <span id="prof-cycles">Nivel 1</span>
                    </div>
                    <div class="data-item">
                        <strong>Progreso:</strong> <span id="prof-summary">Cargando...</span>
                    </div>
                    <div class="data-item">
                        <strong>Letras Procesadas:</strong> <span id="prof-chars">0</span>
                    </div>
                </div>
            </div>

            <div class="panel-section">
                <div class="panel-header">Registros del Búfer</div>
                <div id="history-list-container"></div>
                <button class="btn-utility" onclick="exportCoreData()">Copiar Logs</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
