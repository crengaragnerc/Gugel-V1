<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUGEL Core UI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header>
            <div class="logo">GUGEL <span>CORE</span></div>
            <select id="theme-selector" onchange="changeTheme()">
                <option value="dark">Modo Oscuro</option>
                <option value="light">Modo Claro</option>
                <option value="hacker">Modo Hacker</option>
            </select>
        </header>

        <main id="chat-messages"></main>

        <form id="chat-form">
            <input type="text" id="user-input" placeholder="Comando de entrada..." autocomplete="off">
            <button type="submit">TRANSMITIR</button>
        </form>
    </div>

    <div id="modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h1 id="score-text">0/10</h1>
            <button onclick="closeModal()">Continuar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
