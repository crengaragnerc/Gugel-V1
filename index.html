<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUGEL Core</title>
    <style>
        * { box-sizing: border-box; font-family: monospace; }
        body { margin: 0; background: #121212; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        .chat-card { 
            width: 650px; 
            height: 85vh; 
            background: #1e1e1e; 
            border-radius: 16px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            border: 1px solid #333; 
        }
        
        .header { background: #1a1a1a; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .header h2 { margin: 0; font-size: 1.1rem; color: #00ff00; }
        .mode-selector { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 5px 10px; border-radius: 6px; outline: none; cursor: pointer; }
        
        .status-panel { 
            background: #161616; 
            padding: 12px 20px; 
            border-bottom: 1px solid #333; 
            display: flex; 
            justify-content: flex-end; 
            font-size: 12px; 
            color: #aaa; 
        }
        
        .chat-messages { flex: 1; padding: 25px; overflow-y: auto; background: #141414; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 18px; border-radius: 12px; max-width: 75%; font-size: 14px; line-height: 1.5; }
        .message.gugel { background: #222; align-self: flex-start; color: #00ff00; border: 1px solid #333; }
        .message.ai { background: #00ff00; color: #000; align-self: flex-end; font-weight: bold; }
        
        #chat-form { padding: 20px; border-top: 1px solid #333; display: flex; gap: 10px; background: #1a1a1a; }
        input { flex: 1; padding: 14px; background: #222; border: 1px solid #444; color: #fff; border-radius: 8px; outline: none; font-size: 14px; }
        input:focus { border-color: #00ff00; }
        
        button { padding: 14px 24px; background: #00ff00; color: #000; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }
        
        #continue-btn { background: #fff; color: #000; display: none; width: 100%; }

        /* Modos visuales */
        body.modo-oscuro { background: #121212; }
        body.modo-oscuro .chat-card { background: #1e1e1e; border-color: #333; }
        body.modo-oscuro .header h2 { color: #fff; }
        body.modo-oscuro .message.gugel { color: #fff; background: #2a2a2a; border-color: #444; }
        body.modo-oscuro .message.ai { background: #fff; color: #000; }
        body.modo-oscuro button#transmit-btn { background: #fff; color: #000; }
        
        body.modo-claro { background: #f0f2f5; }
        body.modo-claro .chat-card { background: #ffffff; border-color: #ddd; }
        body.modo-claro .header { background: #f8f9fa; border-color: #ddd; }
        body.modo-claro .header h2 { color: #333; }
        body.modo-claro .chat-messages { background: #fafafa; }
        body.modo-claro .message.gugel { color: #222; background: #f0f0f0; border-color: #e0e0e0; }
        body.modo-claro .message.ai { background: #333; color: #fff; }
        body.modo-claro #chat-form { background: #ffffff; border-color: #ddd; }
        body.modo-claro input { background: #fff; border-color: #ccc; color: #222; }
        body.modo-claro button#transmit-btn { background: #333; color: #fff; }
        body.modo-claro .status-panel { background: #f1f1f1; border-color: #ddd; color: #555; }
    </style>
</head>
<body class="modo-hacker">

    <div class="chat-card">
        <header class="header">
            <h2>GUGEL Core</h2>
            <select class="mode-selector" id="mode-select" onchange="changeSystemMode()">
                <option value="modo-hacker">Modo Hacker</option>
                <option value="modo-oscuro">Modo Oscuro</option>
                <option value="modo-claro">Modo Claro</option>
            </select>
        </header>

        <div class="status-panel">
            <div>
                <span>SATISFACCIÓN: <span id="satisfaction-percentage">50%</span></span>
            </div>
        </div>

        <div class="chat-messages" id="chat-messages"></div>

        <form id="chat-form">
            <input type="text" id="user-input" placeholder="Escribe tu respuesta..." autocomplete="off">
            <button type="submit" id="transmit-btn">TRANSMITIR</button>
            <button type="button" id="continue-btn" onclick="confirmContinue()">CONTINUAR</button>
        </form>
    </div>

    <script>
        const PREGUNTAS = [
            "cagar verde normal", 
            "como hacer cubo rubik", 
            "que se celebra 15 de agosto"
        ];

        // Opiniones del sistema basadas en la calidad de la respuesta entregada
        const OPINIONES_GUGEL = [
            "Menuda sarta de sandeces acabas de transmitir. El núcleo está perdiendo neuronas.",
            "Respuesta aceptable, pero un niño de cinco años lo habría redactado con más elegancia.",
            "¿Te ha costado mucho esfuerzo escribir esa obviedad? Esperaba algo más complejo.",
            "Datos recibidos. La base de datos se siente profundamente insultada por tu respuesta."
        ];

        let gameState = { index: 0, satisfaction: 50 };

        function appendMessage(sender, text) {
            const box = document.getElementById('chat-messages');
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;
            msg.innerHTML = sender === 'gugel' ? `<strong>GUGEL:</strong> ${text}` : text;
            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;
        }

        function nextRound() {
            const input = document.getElementById('user-input');
            const transmitBtn = document.getElementById('transmit-btn');
            const continueBtn = document.getElementById('continue-btn');
            
            continueBtn.style.display = "none";
            transmitBtn.style.display = "block";
            input.style.display = "block";
            
            input.disabled = true; 
            transmitBtn.disabled = true;
            
            let timeLeft = 5;
            input.placeholder = `REFLEXIONANDO... (${timeLeft}s)`;
            
            const timer = setInterval(() => {
                timeLeft--;
                input.placeholder = `REFLEXIONANDO... (${timeLeft}s)`;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    input.disabled = false; 
                    transmitBtn.disabled = false;
                    input.placeholder = "Escribe tu respuesta...";
                    input.focus();
                    
                    // La pregunta aparece ESTRICTAMENTE después de los 5 segundos de cuenta atrás
                    appendMessage('gugel', PREGUNTAS[gameState.index % PREGUNTAS.length]);
                }
            }, 1000);
        }

        document.getElementById('chat-form').onsubmit = (e) => {
            e.preventDefault();
            const input = document.getElementById('user-input');
            const transmitBtn = document.getElementById('transmit-btn');
            const continueBtn = document.getElementById('continue-btn');
            if (!input.value.trim()) return;
            
            // 1. Tu respuesta (AI)
            appendMessage('ai', input.value);
            
            // 2. Opinión ácida de GUGEL
            const opinion = OPINIONES_GUGEL[Math.floor(Math.random() * OPINIONES_GUGEL.length)];
            appendMessage('gugel', opinion);
            
            input.value = "";
            
            input.style.display = "none";
            transmitBtn.style.display = "none";
            continueBtn.style.display = "block";

            updateSatisfaction();
        };

        window.confirmContinue = function() {
            document.getElementById('chat-messages').innerHTML = "";
            gameState.index++;
            nextRound();
        };

        function updateSatisfaction() {
            const cambio = Math.random() > 0.5 ? 10 : -10;
            gameState.satisfaction += cambio;
            
            if (gameState.satisfaction > 100) gameState.satisfaction = 100;
            if (gameState.satisfaction < 0) gameState.satisfaction = 0;
            
            document.getElementById('satisfaction-percentage').innerText = `${gameState.satisfaction}%`;
        }

        function changeSystemMode() {
            const select = document.getElementById('mode-select');
            document.body.className = ''; 
            if (select.value !== 'modo-hacker') {
                document.body.classList.add(select.value);
            }
        }

        // Ejecución controlada tras la carga del DOM
        window.onload = function() {
            nextRound();
        };
    </script>
</body>
</html>
