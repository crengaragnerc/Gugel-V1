<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUGEL Core - Modo Historia</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --panel-bg: #161820;
            --border-color: #2a2d3d;
            --text-color: #e2e8f0;
            --accent-color: #3b82f6;
            --gugel-msg: #1f2937;
            --ai-msg: #2563eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 2px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: #f39c12;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Panel Izquierdo: El Chat con GUGEL */
        .chat-panel {
            flex: 2;
            display: flex;
            flex-direction: column;
            border-right: 2px solid var(--border-color);
            background: #090a0f;
        }

        #chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.4;
            font-size: 0.95rem;
        }

        .message.gugel {
            background-color: var(--gugel-msg);
            align-self: flex-start;
            border-left: 4px solid #f1c40f;
        }

        .message.ai {
            background-color: var(--ai-msg);
            align-self: flex-end;
            border-right: 4px solid #00ff00;
        }

        .input-area {
            background-color: var(--panel-bg);
            border-top: 2px solid var(--border-color);
            padding: 15px;
        }

        #chat-form {
            display: flex;
            gap: 10px;
        }

        #user-input {
            flex: 1;
            background-color: #0d0e12;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1rem;
        }

        #user-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2563eb;
        }

        button:disabled, #user-input:disabled {
            background-color: #1f222e;
            color: #555;
            cursor: not-allowed;
        }

        #continue-btn {
            background-color: #27ae60;
            width: 100%;
            padding: 12px;
        }

        #continue-btn:hover {
            background-color: #219653;
        }

        /* Panel Derecho: Monitor de Estado */
        .status-panel {
            flex: 1;
            max-width: 400px;
            background-color: var(--panel-bg);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .panel-section {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .panel-header {
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #3b82f6;
            margin-bottom: 15px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 5px;
        }

        .data-item {
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        .data-item strong {
            color: #a0aec0;
        }

        /* Historial en la zona inferior del panel */
        #history-list-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
        }

        .historial-item {
            background-color: #0d0e12;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            line-height: 1.4;
        }

        /* Utilidades */
        .btn-utility {
            background-color: #34495e;
            padding: 8px 12px;
            font-size: 0.8rem;
            margin-top: 10px;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="panel-title-text">GUGEL - Modo Historia (Cargando...)</h1>
        <div>v2.1.0_Historia</div>
    </header>

    <div class="main-container">
        <!-- Panel de Interacción Directa -->
        <div class="chat-panel">
            <div id="chat-messages">
                <!-- Los mensajes se inyectan dinámicamente -->
            </div>
            
            <div class="input-area">
                <form id="chat-form">
                    <input type="text" id="user-input" autocomplete="off" placeholder="Esperando que GUGEL piense...">
                    <button type="submit" id="transmit-btn">RESPONDER</button>
                    <button type="button" id="continue-btn" style="display: none;" onclick="confirmContinue()">PASAR DE NIVEL</button>
                </form>
            </div>
        </div>

        <!-- Panel de Diagnóstico y Estado Fijo -->
        <div class="status-panel">
            <div class="panel-section">
                <div class="panel-header">Estado del Sistema</div>
                <div class="panel-body">
                    <div class="data-item">
                        <strong>Opinión de GUGEL:</strong> <span id="prof-opinion">(Mirando la pantalla...)</span>
                    </div>
                    <div class="data-item">
                        <strong>Satisfacción:</strong> <span id="prof-satisfaction">50%</span>
                    </div>
                    <div class="data-item">
                        <strong>Fase Actual:</strong> <span id="prof-cycles">Nivel 1</span>
                    </div>
                    <div class="data-item">
                        <strong>Progreso:</strong> <span id="prof-summary">Progreso: 0 / 10</span>
                    </div>
                    <div class="data-item">
                        <strong>Caracteres IA:</strong> <span id="prof-chars">0</span>
                    </div>
                </div>
            </div>

            <div class="panel-section">
                <div class="panel-header">Búfer de Logs (Historial)</div>
                <div id="history-list-container">
                    <!-- Aquí se guardan las preguntas contestadas -->
                </div>
                <button class="btn-utility" onclick="exportCoreData()">Copiar Logs al Portapapeles</button>
            </div>
        </div>
    </div>

    <!-- Vinculamos tu script.js personalizado -->
    <script src="script.js"></script>
</body>
</html>
