<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUGEL Core System</title>
    <style>
        /* ESTILOS ORIGINALES DEL JUEGO */
        :root {
            --bg-color: #1a1a24;
            --panel-bg: #252538;
            --border-color: #3f3f5a;
            --text-color: #ffffff;
            --accent-color: #ff9f43;
            --gugel-msg: #32324d;
            --ai-msg: #5f27cd;
        }

        body.modo-claro {
            --bg-color: #f5f6fa;
            --panel-bg: #ffffff;
            --border-color: #dcdde1;
            --text-color: #2f3640;
            --accent-color: #e67e22;
            --gugel-msg: #dcdde1;
            --ai-msg: #9c88ff;
        }

        body.modo-hacker {
            --bg-color: #000000;
            --panel-bg: #0c0c0c;
            --border-color: #00ff00;
            --text-color: #00ff00;
            --accent-color: #00ff00;
            --gugel-msg: #141414;
            --ai-msg: #004400;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Tu estructura original de paneles de pestañas */
        .sidebar {
            width: 260px;
            background-color: var(--panel-bg);
            border-right: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 10px;
        }

        .nav-btn {
            background: none;
            border: 2px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-weight: bold;
            transition: all 0.2s;
        }

        .nav-btn.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: #000;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
        }

        .top-bar {
            background-color: var(--panel-bg);
            border-bottom: 2px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .selectors-group {
            display: flex;
            gap: 15px;
        }

        select {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
        }

        .content-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .content-panel {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: none;
            flex-direction: column;
            padding: 20px;
        }

        .content-panel.active { display: flex; }

        /* Panel de consultas (Chat) */
        .chat-box {
            flex: 1;
            background-color: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px;
            border-radius: 8px;
            line-height: 1.4;
        }
        .message.gugel { background-color: var(--gugel-msg); align-self: flex-start; }
        .message.ai { background-color: var(--ai-msg); align-self: flex-end; }

        .input-form { display: flex; gap: 10px; }
        .input-form input {
            flex: 1;
            background-color: var(--panel-bg);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
        }
        .input-form button {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 0 25px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Estilos del panel de Perfil/Estado de antes */
        .grid-info {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .card-info {
            background-color: var(--panel-bg);
            border: 2px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
        }
        .card-info h3 { font-size: 0.85rem; color: #a0aec0; text-transform: uppercase; margin-bottom: 5px; }
        body.modo-hacker .card-info h3 { color: #00ff00; }
        .card-info p { font-size: 1.2rem; font-weight: bold; }

        .historial-lista {
            flex: 1;
            background-color: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .historial-item {
            background-color: var(--bg-color);
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid var(--accent-color);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- MENÚ LATERAL DE ANTES -->
    <div class="sidebar">
        <h2 style="font-size: 1.3rem; margin-bottom: 15px; text-align: center; color: var(--accent-color)">GUGEL Core</h2>
        <button id="btn-view-consultas" class="nav-btn active" onclick="switchView('view-consultas')">Consola Central</button>
        <button id="btn-view-perfil" class="nav-btn" onclick="switchView('view-perfil')">Estado y Datos</button>
        <button id="btn-view-historial" class="nav-btn" onclick="switchView('view-historial')">Búfer de Logs</button>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-content">
        <div class="top-bar">
            <h2 id="panel-title-text">GUGEL Core</h2>
            <div class="selectors-group">
                <!-- Selector de Modo -->
                <select id="game-mode-select" onchange="cambiarModoJuego()">
                    <option value="historia">Modo Historia (10 Niveles)</option>
                    <option value="infinito">Modo Infinito (Aleatorio)</option>
                </select>
                <!-- Selector de Temas que antes no iba -->
                <select id="mode-select" onchange="changeSystemMode()">
                    <option value="modo-oscuro">Tema Oscuro</option>
                    <option value="modo-claro">Tema Claro</option>
                    <option value="modo-hacker">Tema Hacker</option>
                </select>
            </div>
        </div>

        <div class="content-container">
            <!-- PESTAÑA 1: CONSOLA DE CONSULTAS -->
            <div id="view-consultas" class="content-panel active">
                <div id="chat-messages" class="chat-box"></div>
                <form id="chat-form" class="input-form">
                    <input type="text" id="user-input" autocomplete="off" placeholder="Escribe tu respuesta de IA...">
                    <button type="submit" id="transmit-btn">TRANSMITIR</button>
                    <button type="button" id="continue-btn" style="display: none; background-color: #2ecc71;" onclick="confirmContinue()">SIGUIENTE</button>
                </form>
            </div>

            <!-- PESTAÑA 2: ESTADO Y DATOS -->
            <div id="view-perfil" class="content-panel">
                <div class="grid-info">
                    <div class="card-info">
                        <h3>Opinión de GUGEL</h3>
                        <p id="prof-opinion">(esperando...)</p>
                    </div>
                    <div class="card-info">
                        <h3>Satisfacción</h3>
                        <p id="prof-satisfaction">50%</p>
                    </div>
                    <div class="card-info">
                        <h3>Fase Actual</h3>
                        <p id="prof-cycles">Nivel 1</p>
                    </div>
                    <div class="card-info">
                        <h3>Progreso Fijo</h3>
                        <p id="prof-summary">0 / 10</p>
                    </div>
                </div>
                <div class="card-info" style="margin-top: 10px;">
                    <h3>Caracteres Totales Procesados</h3>
                    <p id="prof-chars">0</p>
                </div>
            </div>

            <!-- PESTAÑA 3: BÚFER DE LOGS -->
            <div id="view-historial" class="content-panel">
                <div id="history-list-container" class="historial-lista"></div>
                <button onclick="exportCoreData()" class="nav-btn" style="margin-top: 15px; text-align: center;">Copiar Logs al Portapapeles</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
